{{- /* Waline comments: guest-comment support, no login required.
       Hidden until params.waline.serverURL is configured. */ -}}
{{- if and site.Params.comments site.Params.waline.serverURL }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@waline/client@v3/dist/waline.css">
<div id="waline"></div>
<script>
(function () {
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@waline/client@v3/dist/waline.js';
    s.onload = function () {
        if (!window.Waline) return;
        Waline.init({
            el: '#waline',
            serverURL: '{{ site.Params.waline.serverURL }}',
            dark: 'html[data-theme="dark"]', /* covers the dark-green eye-care mode too */
            lang: 'zh-CN'
        });
    };
    document.head.appendChild(s);
})();
</script>
{{- end }}
