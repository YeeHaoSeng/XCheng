{{- /* Waline comments: guest-comment support, no login required.
       Hidden until params.waline.serverURL is configured.
       Waline v3 is ESM-only: it must be imported, not <script src>'d. */ -}}
{{- if and site.Params.comments site.Params.waline.serverURL }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@waline/client@3.15.2/dist/waline.css">
<div id="waline"></div>
<script type="module">
import { init } from 'https://cdn.jsdelivr.net/npm/@waline/client@3.15.2/dist/waline.js';
init({
    el: '#waline',
    serverURL: '{{ site.Params.waline.serverURL }}',
    dark: 'html[data-theme="dark"]', /* covers the dark-green eye-care mode too */
    lang: 'zh-CN'
});
</script>
{{- end }}
