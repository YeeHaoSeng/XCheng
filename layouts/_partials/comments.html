{{- /* Cusdis comments: hosted, guest commenters, no login needed.
       Hidden until params.cusdis.appid is configured. */ -}}
{{- if and site.Params.comments site.Params.cusdis.appid }}
<div id="cusdis_thread"
     data-host="https://cusdis.com"
     data-app-id="{{ site.Params.cusdis.appid }}"
     data-page-id="{{ .Permalink }}"
     data-page-url="{{ .Permalink }}"
     data-page-title="{{ .Title }}"></div>
<script async defer src="https://cusdis.com/js/cusdis.es.js"></script>
{{- end }}
